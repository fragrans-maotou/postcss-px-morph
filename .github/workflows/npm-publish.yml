name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# 权限配置绝对不能少
permissions:
  contents: read
  id-token: write 

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ❌ 删除下面这一行！不要配置 registry-url
          # registry-url: 'https://registry.npmjs.org' 

      - name: Install dependencies
        run: npm ci

      # 建议加上构建步骤（如果有的话），比如：
      # - name: Build
      #   run: npm run build

      - name: Publish package
        # Trusted Publishers 模式下，这一步会自动处理认证
        run: npm publish --provenance --access public
