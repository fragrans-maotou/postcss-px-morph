name: Build and Publish NPM Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # 只有打上 v 开头的 tag (如 v1.0.0) 时才触发发布流程
  pull_request:
    branches: [ "main" ]

jobs:
  # 第一步：构建和测试
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # 开启缓存，加快构建速度

    # 使用 npm ci 代替 npm install，在 CI 环境中更稳定
    - name: Install Dependencies
      run: npm ci

    # 如果 grunt 不是全局安装的，建议使用 npx grunt 或在 package.json scripts 中运行
    - name: Run Grunt Build
      run: |
        npx grunt

    # 建议加上测试步骤
    - name: Run Test
      run: npm test

  # 第二步：发布到 NPM (只有当 push tag 时才执行)
  publish-npm:
    needs: build-and-test # 必须等测试全部通过
    if: startsWith(github.ref, 'refs/tags/v') # 只有是 tag 推送时才运行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js for Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # 发布只需要用一个稳定的版本即可
          registry-url: 'https://registry.npmjs.org' # 指定发布源

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npx grunt

      - name: Publish to NPM
        run: npm publish
        env:
          # 这个 Token 需要在 GitHub 仓库的 Secrets 中配置
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
