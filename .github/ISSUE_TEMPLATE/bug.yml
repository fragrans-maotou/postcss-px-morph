name: Bug report
description: Report incorrect conversion or a runtime issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: Your postcss-px-morph options (mode, hybridOptions, etc.)
      render: js
    validations:
      required: true
  - type: textarea
    id: css
    attributes:
      label: CSS snippet
      description: Minimal input CSS that reproduces the issue
      render: css
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.0.4
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node / PostCSS / bundler versions if relevant
